<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" fill="none">
  <defs>
    <linearGradient id="tLocalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Shield -->
  <g transform="translate(4, 5)">
    <rect width="48" height="48" rx="12" fill="url(#shieldGrad)"/>
    <!-- Outer ring glow -->
    <rect x="1" y="1" width="46" height="46" rx="11" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.3"/>
    
    <!-- Stylized "T" + Pin / Wrench Motif -->
    <!-- Top Bar of T -->
    <path d="M14 16 L34 16 C35.1 16 36 16.9 36 18 L36 20 C36 21.1 35.1 22 34 22 L27 22 L27 34 C27 35.1 26.1 36 25 36 L23 36 C21.9 36 21 35.1 21 34 L21 22 L14 22 C12.9 22 12 21.1 12 20 L12 18 C12 16.9 12.9 16 14 16 Z" fill="url(#tLocalGrad)"/>
    <!-- Spark / Quality star -->
    <circle cx="35" cy="14" r="3" fill="#38BDF8"/>
    <!-- Checkmark accent -->
    <path d="M22 28 L24 30 L28 25" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Typography -->
  <text x="62" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="18" fill="#0F172A" letter-spacing="-0.3">
    T-LOCAL
  </text>
  <text x="140" y="28" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="16" fill="#0284C7">
    SERVICE TEAM
  </text>
  
  <text x="63" y="44" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="600" font-size="8.5" fill="#64748B" letter-spacing="1.2">
    PREMIER LOCAL &amp; COMMERCIAL SERVICES
  </text>
</svg>
